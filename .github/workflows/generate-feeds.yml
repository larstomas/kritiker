name: Generate RSS Feeds

on:
  schedule:
    - cron: "0 */2 * * *"  # Every 2 hours
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate feeds
        run: python main.py --opml --pages-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Add index page
        run: |
          cat > output/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="sv">
          <head><meta charset="utf-8"><title>Kritiker.se RSS</title></head>
          <body>
            <h1>Kritiker.se RSS Feeds</h1>
            <ul>
              <li><a href="filmer.xml">Filmer</a></li>
              <li><a href="serier.xml">Serier</a></li>
              <li><a href="skivor.xml">Skivor</a></li>
              <li><a href="spel.xml">Spel</a></li>
            </ul>
            <p><a href="kritiker.opml">OPML (import all feeds)</a></p>
          </body>
          </html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
